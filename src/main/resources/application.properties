# The redaction policy schema version supported by the bundled Phileas runtime.
# A given Phileas build understands exactly one schema version, and the editor authors that same
# version, so this must match the bundled schema or the "Test Policy" feature is disabled.
#
# TODO: once the phileas dependency is bumped to a release that includes
# ai.philterd.phileas.policy.PolicySchema, derive this at runtime from
# PolicySchema.getSupportedSchemaVersion() instead of hard-coding it here.
phileas.supported-schema-version=1.1.0

# Expose only the health and Prometheus actuator endpoints, matching Philter. Prometheus scrapes
# metrics from /actuator/prometheus. The discovery index at /actuator is disabled so those two
# paths are the only ones that respond.
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
